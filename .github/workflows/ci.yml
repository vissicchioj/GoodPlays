# Runs on every push to master and on every pull request.
# If any step fails, GitHub marks the commit with a red ✗ and emails you.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what's in package-lock.json (and fails if it's
      # out of sync with package.json). Its postinstall step runs
      # `prisma generate`, which doesn't need a database.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `next build` also type-checks the whole project, so this step catches
      # TypeScript errors too.
      - name: Build
        run: npm run build
        env:
          # Placeholders: the build never connects to a database or GitHub,
          # but these keep the code paths that read them happy. Real secrets
          # live only in Vercel and your local .env, never in this file.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-secret
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
          TWITCH_CLIENT_ID: ci-placeholder
          TWITCH_CLIENT_SECRET: ci-placeholder